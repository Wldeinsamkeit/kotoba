<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>临时解锁全部课程</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3ec;
        color: #171713;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100% - 48px));
        padding: 28px;
        border: 1px solid #e3ded2;
        border-radius: 18px;
        background: #fffdfa;
        box-shadow: 0 18px 50px #00000012;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .meta { color: #68645c; line-height: 1.7; margin: 0 0 16px; }
      #status {
        padding: 12px 14px;
        border-radius: 12px;
        background: #f0ebe0;
        color: #3f3b33;
        line-height: 1.6;
        margin-bottom: 16px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
      button, a.btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      button.primary, a.btn.primary { background: #c96442; color: #fff; }
      button.secondary, a.btn.secondary {
        background: #fff;
        color: #171713;
        border: 1px solid #e3ded2;
      }
      ul { margin: 0; padding-left: 18px; color: #68645c; line-height: 1.7; }
      code { background: #f0ebe0; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>临时解锁全部课程</h1>
      <p class="meta">共 49 课。仅在当前浏览器写入 localStorage，刷新后生效。</p>
      <p id="status">点击下方按钮写入解锁记录。</p>
      <div class="actions">
        <button type="button" class="primary" id="unlock-btn">解锁全部课程</button>
        <button type="button" class="secondary" id="check-mode-btn">仅开启检查模式</button>
        <button type="button" class="secondary" id="reset-btn">清除解锁记录</button>
        <a class="btn secondary" href="/lessons">课程列表</a>
        <a class="btn secondary" href="/lesson-check">检查台</a>
      </div>
      <ul>
        <li>写入键：<code>nihongo-daily-progress-v1</code></li>
        <li>检查模式键：<code>nihongo-lesson-check-mode</code></li>
        <li>默认同时写入「全部通过」并开启检查模式</li>
      </ul>
    </main>
    <script>
      const lessonIds = [
  "self-introduction",
  "where-are-you-from",
  "please-speak-slowly",
  "campus-greeting",
  "borrow-pen-in-class",
  "morning-combini-breakfast",
  "how-to-do-it",
  "cafeteria-find-seat",
  "what-is-this",
  "asking-directions",
  "which-train-to-ikebukuro",
  "train-transfer",
  "n4_wait_how_long",
  "restaurant-order-lunch",
  "restaurant-waiting-list",
  "dont-put-wasabi",
  "how-much-is-it",
  "pay-by-card",
  "atm-withdraw-cash",
  "i-want-gloves",
  "exchange-size",
  "hair-salon-cut",
  "do-you-have-omamori",
  "can-i-take-a-photo",
  "invite-photo",
  "invite-go-together",
  "meet-at-what-time",
  "late-apology",
  "library-books",
  "i-have-read-it",
  "n4_reason_because_first_time",
  "n4_compare_outside_better",
  "weather-plan-change",
  "what-time-is-the-bath",
  "hotel-check-in",
  "laundry-machine-how-to-use",
  "garbage-sorting",
  "post-office-package",
  "delivery-redelivery",
  "throat-hurts",
  "pharmacy-cold-medicine",
  "clinic-reception",
  "lost-wallet",
  "absence-note",
  "refuse-invitation",
  "n3_hearsay_concert",
  "n3_plan_intend_to_give",
  "part-time-interview",
  "n2_polite_request_check_japanese"
];
      const progressKey = "nihongo-daily-progress-v1";
      const checkModeKey = "nihongo-lesson-check-mode";
      const defaultCheckMode = true;
      const statusEl = document.getElementById('status');

      function readProgress() {
        try {
          return JSON.parse(localStorage.getItem(progressKey) || '{}');
        } catch {
          return {};
        }
      }

      function unlockAll(options = {}) {
        const withCheckMode = options.withCheckMode ?? defaultCheckMode;
        const current = readProgress();
        const completedLessonIds = Array.from(new Set([
          ...(Array.isArray(current.completedLessonIds) ? current.completedLessonIds : []),
          ...lessonIds,
        ]));
        const quizStats = { ...(current.quizStats || {}) };
        for (const id of lessonIds) {
          quizStats[id] = { correct: 3, total: 3 };
        }
        localStorage.setItem(progressKey, JSON.stringify({
          ...current,
          completedLessonIds,
          quizStats,
        }));
        if (withCheckMode) {
          localStorage.setItem(checkModeKey, '1');
        }
        window.dispatchEvent(new Event('nihongo-lesson-check-mode-change'));
        statusEl.textContent =
          '已解锁 ' + lessonIds.length + ' 课' +
          (withCheckMode ? '，并已开启检查模式。' : '。') +
          ' 可返回课程列表任意进入。';
      }

      function enableCheckModeOnly() {
        localStorage.setItem(checkModeKey, '1');
        window.dispatchEvent(new Event('nihongo-lesson-check-mode-change'));
        statusEl.textContent = '已开启检查模式：课程入口不再按顺序锁定（不清除原有进度）。';
      }

      function resetUnlock() {
        const current = readProgress();
        const completedLessonIds = (current.completedLessonIds || [])
          .filter((id) => !lessonIds.includes(id));
        const quizStats = { ...(current.quizStats || {}) };
        for (const id of lessonIds) {
          delete quizStats[id];
        }
        localStorage.setItem(progressKey, JSON.stringify({
          ...current,
          completedLessonIds,
          quizStats,
        }));
        localStorage.removeItem(checkModeKey);
        window.dispatchEvent(new Event('nihongo-lesson-check-mode-change'));
        statusEl.textContent = '已清除全部课程的临时通过记录，并关闭检查模式。';
      }

      document.getElementById('unlock-btn').addEventListener('click', () => unlockAll());
      document.getElementById('check-mode-btn').addEventListener('click', enableCheckModeOnly);
      document.getElementById('reset-btn').addEventListener('click', resetUnlock);

      if (new URLSearchParams(location.search).get('auto') === '1') {
        unlockAll();
        setTimeout(() => location.replace('/lessons?review=unlocked'), 700);
      }
    </script>
  </body>
</html>
