<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>48 课检查解锁</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3ec;
        color: #171713;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(520px, calc(100% - 48px));
        padding: 28px;
        border: 1px solid #e3ded2;
        border-radius: 18px;
        background: #fffdfa;
        box-shadow: 0 18px 50px #00000012;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { color: #68645c; line-height: 1.7; }
      a { color: #c96442; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>48 课已临时全部通过</h1>
      <p id="status">正在写入本地学习进度...</p>
      <p><a href="/lesson-check">打开 48 课检查台</a></p>
      <p><a href="/lessons">回到课程列表</a></p>
    </main>
    <script>
      const lessonIds = [
  "self-introduction",
  "where-are-you-from",
  "please-speak-slowly",
  "campus-greeting",
  "borrow-pen-in-class",
  "morning-combini-breakfast",
  "how-to-do-it",
  "cafeteria-find-seat",
  "what-is-this",
  "asking-directions",
  "which-train-to-ikebukuro",
  "train-transfer",
  "n4_wait_how_long",
  "restaurant-order-lunch",
  "restaurant-waiting-list",
  "dont-put-wasabi",
  "how-much-is-it",
  "pay-by-card",
  "atm-withdraw-cash",
  "i-want-gloves",
  "exchange-size",
  "hair-salon-cut",
  "do-you-have-omamori",
  "can-i-take-a-photo",
  "invite-photo",
  "invite-go-together",
  "meet-at-what-time",
  "late-apology",
  "library-books",
  "i-have-read-it",
  "n4_reason_because_first_time",
  "n4_compare_outside_better",
  "weather-plan-change",
  "what-time-is-the-bath",
  "hotel-check-in",
  "laundry-machine-how-to-use",
  "garbage-sorting",
  "post-office-package",
  "delivery-redelivery",
  "throat-hurts",
  "pharmacy-cold-medicine",
  "clinic-reception",
  "lost-wallet",
  "absence-note",
  "refuse-invitation",
  "n3_hearsay_concert",
  "n3_plan_intend_to_give",
  "part-time-interview",
  "n2_polite_request_check_japanese"
];
      const progressKey = 'nihongo-daily-progress-v1';
      const checkModeKey = 'nihongo-lesson-check-mode';
      const current = JSON.parse(localStorage.getItem(progressKey) || '{}');
      const completedLessonIds = Array.from(new Set([
        ...(Array.isArray(current.completedLessonIds) ? current.completedLessonIds : []),
        ...lessonIds,
      ]));
      const quizStats = { ...(current.quizStats || {}) };
      for (const id of lessonIds) {
        quizStats[id] = quizStats[id] || { correct: 3, total: 3 };
      }
      localStorage.setItem(progressKey, JSON.stringify({
        ...current,
        completedLessonIds,
        quizStats,
      }));
      localStorage.setItem(checkModeKey, '1');
      document.getElementById('status').textContent =
        '已写入 ' + lessonIds.length + ' 课通过记录，并开启检查模式。';
      setTimeout(() => {
        location.replace('/lesson-check');
      }, 700);
    </script>
  </body>
</html>
